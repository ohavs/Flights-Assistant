name: Cloud Functions

# Push to trip partners (N5) runs in Cloud Functions (functions/). On merge
# to master, when functions/ changes, this deploys it. The tests run in CI
# (tests/push.test.mjs, tests/pushHandlers.test.mjs) and again here before
# deploying. Logs of this public repo are public: FIREBASE_TOKEN is a
# secret and never printed.
on:
  push:
    branches: [master]
    paths: [functions/**, .github/workflows/functions.yml, firebase.json]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: functions-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PROJECT: listify-84018
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm ci --prefix functions --no-audit --no-fund

      - name: Unit tests
        run: node --test tests/push.test.mjs

      - name: Deploy, until all the functions are live
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          WANT: pushExpense pushPlace pushActivity pushTrip
        run: |
          set -uo pipefail
          [ -n "$FIREBASE_TOKEN" ] || { echo "::error::FIREBASE_TOKEN is not set"; exit 1; }
          fb() { npx -y firebase-tools@14.27.0 "$@" --project "$PROJECT" --non-interactive; }
          live() {
            local list; list=$(fb functions:list 2>/dev/null) || return 1
            echo "$list"
            for f in $WANT; do echo "$list" | grep -q "$f" || return 1; done
          }
          # The first deploy turns on the APIs that Functions needs; for a few
          # minutes after, creating a function can fail (503), and the CLI
          # may still exit 0. So the list of live functions decides, not the
          # exit code.
          for try in 1 2 3 4; do
            fb deploy --only functions --force || echo "deploy exited non-zero (attempt $try)"
            if live; then echo "All functions are live."; exit 0; fi
            [ "$try" = 4 ] || { echo "Not all functions are live yet (attempt $try); retrying in 3 minutes."; sleep 180; }
          done
          echo "::error::The functions did not deploy after 4 attempts."
          exit 1
