name: Android

# Builds the signed APK on every PR and every push to master, checks it is
# signed with the release key, and boots it on an emulator. On master it then
# publishes a GitHub Release, which the app's "check for updates" installs
# from — but only when something that ships in the APK changed since the last
# release. The release notes come from release-notes.md.
#
# Required repository secrets:
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD (the release key)
#   VITE_GOOGLE_MAPS_KEY, VITE_AERODATABOX_KEY (same as the web build)
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Release key fingerprint. Android only installs an update signed by the same
  # key, so a build signed with anything else must never be published.
  CERT_SHA256: 09effd90fe15e457b4a554ce1ad3aefc6d18e1a740a1aade656de091919cdcd3
  # The app's own version line (the web keeps 8.x in changelog.md).
  APP_VERSION: '1.0'

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      code: ${{ steps.v.outputs.code }}
      name: ${{ steps.v.outputs.name }}
    steps:
      - name: Check that all secrets are set (and trim whitespace)
        env:
          RAW_VITE_GOOGLE_MAPS_KEY: ${{ secrets.VITE_GOOGLE_MAPS_KEY }}
          RAW_VITE_AERODATABOX_KEY: ${{ secrets.VITE_AERODATABOX_KEY }}
          RAW_ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          RAW_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          missing=0
          for v in VITE_GOOGLE_MAPS_KEY VITE_AERODATABOX_KEY ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD; do
            raw="RAW_$v"
            val="$(printf '%s' "${!raw}" | tr -d '[:space:]')"
            if [ -z "$val" ]; then echo "::error::Missing repository secret $v"; missing=1; continue; fi
            echo "::add-mask::$val"
            echo "$v=$val" >> "$GITHUB_ENV"
          done
          exit $missing

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build web and sync into Android
        run: |
          npm ci --no-audit --no-fund --legacy-peer-deps
          npm run build
          grep -q "$VITE_GOOGLE_MAPS_KEY" dist/assets/*.js || { echo "::error::Maps key missing from the build"; exit 1; }
          grep -q "$VITE_AERODATABOX_KEY" dist/assets/*.js || { echo "::error::AeroDataBox key missing from the build"; exit 1; }
          npx cap sync android

      - name: Version
        id: v
        run: |
          echo "code=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"
          echo "name=$APP_VERSION.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Build signed APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.p12
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE_FILE"
          ./gradlew assembleRelease --no-daemon -PversionCode=${{ steps.v.outputs.code }} -PversionName=${{ steps.v.outputs.name }}
          rm -f "$ANDROID_KEYSTORE_FILE"

      - name: Check signature
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$TOOLS/apksigner" verify --print-certs "$APK" | tee certs.txt
          grep -qi "SHA-256 digest: $CERT_SHA256" certs.txt || { echo "::error::APK is not signed with the release key"; exit 1; }
          cp "$APK" flights-assistant.apk
          sha256sum flights-assistant.apk | cut -d' ' -f1 > flights-assistant.apk.sha256
          "$TOOLS/aapt2" dump badging flights-assistant.apk | tee badging.txt | grep -E "^package|uses-permission|targetSdk"
          # Flight reminders need the notification permission and the plugin.
          grep -q "android.permission.POST_NOTIFICATIONS" badging.txt || { echo "::error::POST_NOTIFICATIONS missing"; exit 1; }
          grep -q '"LocalNotifications"' android/app/src/main/assets/capacitor.plugins.json 2>/dev/null \
            || grep -q "LocalNotifications" android/app/src/main/assets/capacitor.config.json \
            || { echo "::error::local notifications plugin not synced"; exit 1; }
          unzip -l flights-assistant.apk | grep -q "assets/public/index.html"

      - uses: actions/upload-artifact@v4
        with:
          name: flights-assistant-${{ steps.v.outputs.name }}
          path: |
            flights-assistant.apk
            flights-assistant.apk.sha256

  # Boot the APK on an emulator and check the app renders its first screen.
  smoke:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: flights-assistant-*
          merge-multiple: true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # The emulator action downloads the system image itself, and once in a
      # while the download comes back broken ("Error on ZipFile unknown
      # archive"): the job then dies before any test. Fetched here first,
      # with retries; the action finds it installed.
      - name: Fetch the emulator's system image
        run: |
          SDKM=$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")
          IMG="$ANDROID_HOME/system-images/android-34/google_apis/x86_64"
          for i in 1 2 3; do
            echo y | "$SDKM" --install 'system-images;android-34;google_apis;x86_64' --channel=0 > /dev/null || true
            [ -f "$IMG/system.img" ] && exit 0
            echo "system image download $i failed; trying again"
            rm -rf "$IMG"; sleep 10
          done
          exit 1
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash scripts/android-smoke.sh flights-assistant.apk && bash scripts/widget-shots.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-smoke
          path: |
            android-smoke.png
            android-signin.png
            android-share.png
            ui.xml
            widget-*.png

  # The emulator's screenshots on the ci-shots branch, for review from a git
  # checkout. Its own job: only this one may write, and it runs no code
  # from the change, just git.
  shots:
    needs: smoke
    if: always() && needs.smoke.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-smoke
          path: shots
      - name: Publish to ci-shots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd shots
          ls -1
          git init -q -b ci-shots
          git add .
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Emulator screenshots for $GITHUB_SHA"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-shots

  # Publish only after the APK booted on the emulator, and only from master.
  release:
    needs: [apk, smoke]
    if: github.event_name == 'push' && github.ref_name == 'master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: android-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: flights-assistant-*
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          LAST=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          SHIPPED="src public index.html android package.json package-lock.json capacitor.config.json vite.config.js"
          if [ -n "$LAST" ] && git diff --quiet "$LAST" HEAD -- $SHIPPED; then
            echo "Nothing in the app changed since $LAST; no release."; exit 0
          fi
          if [ -z "$LAST" ] || ! git diff --quiet "$LAST" HEAD -- release-notes.md; then
            cp release-notes.md notes.md
          else
            echo "- שיפורים ותיקונים" > notes.md
          fi
          printf '\n<!-- update {"versionCode":%s,"sha256":"%s","apk":"flights-assistant.apk"} -->\n' \
            "${{ needs.apk.outputs.code }}" "$(cat flights-assistant.apk.sha256)" >> notes.md
          gh release create "v${{ needs.apk.outputs.name }}" flights-assistant.apk \
            --target "$GITHUB_SHA" --title "גרסה ${{ needs.apk.outputs.name }}" --notes-file notes.md --latest
