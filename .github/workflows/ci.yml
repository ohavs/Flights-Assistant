name: CI

# Runs on every PR and every push to master: build, security-rules tests and a
# browser smoke test, all against the Firebase emulators (never the real
# project). The deploy itself is deploy.yml.
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # The tests take ~8 minutes; the rest is slack for a slow runner. On
    # 2026-10-26 "Install Chromium" (apt) took 14 minutes on master and the
    # run was cut at 20 with every test passing so far.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --no-audit --no-fund --legacy-peer-deps
      - name: Build
        run: npm run build
      - name: Security-rules tests (Firestore emulator)
        run: npm run test:data
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser smoke test (emulators)
        run: npm run test:e2e
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-output
          path: .e2e/*.png
          if-no-files-found: ignore
          # .e2e is a dot-directory, which upload-artifact skips by default:
          # without this the fail-*.png screenshots never reach the artifact.
          include-hidden-files: true
